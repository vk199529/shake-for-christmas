<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frohe Weihnachten 🎄</title>
<style>
  :root{
    --navy:#0c1f4a;
    --navy-deep:#081536;
    --gold:#f5c623;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
  }
  .stage{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
    text-align:center;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .bgstar{
    position:absolute;
    background:var(--white);
    border-radius:50%;
    opacity:.6;
    animation: twinkleBg 2.5s ease-in-out infinite;
  }
  @keyframes twinkleBg{ 0%,100%{opacity:.15;} 50%{opacity:.7;} }

  .headline{
    font-size: clamp(22px, 6vw, 34px);
    font-weight:800;
    color:var(--gold);
    letter-spacing:.5px;
    margin-bottom:6px;
    transition:opacity .5s ease;
  }
  .subline{
    font-size:14px;
    color:#c9d3ea;
    margin-bottom:28px;
    max-width:320px;
    transition:opacity .5s ease;
  }

  .globe-wrap{
    position:relative;
    width:min(78vw,320px);
    aspect-ratio:1/1;
    cursor:pointer;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,.4));
  }
  .globe-wrap.shaking{
    animation: shakeGlobe .5s ease-in-out;
  }
  @keyframes shakeGlobe{
    0%,100%{ transform:rotate(0deg) translateX(0); }
    15%{ transform:rotate(-6deg) translateX(-6px); }
    30%{ transform:rotate(5deg) translateX(6px); }
    45%{ transform:rotate(-4deg) translateX(-4px); }
    60%{ transform:rotate(4deg) translateX(4px); }
    75%{ transform:rotate(-2deg) translateX(-2px); }
  }
  .globe-glass{
    position:absolute;
    inset:0;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(255,255,255,.02) 40%),
                radial-gradient(circle at 60% 70%, #12306e 0%, #0a1c47 70%);
    border:2px solid rgba(255,255,255,.35);
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 25px rgba(245,198,35,.15);
  }
  .scene{
    position:absolute;
    left:0; right:0; bottom:14%;
    height:55%;
  }
  .ground{
    position:absolute;
    left:-10%; right:-10%; bottom:0;
    height:34%;
    background: linear-gradient(180deg, #eef4ff 0%, #d7e3f7 100%);
    border-radius:50% 50% 0 0/60% 60% 0 0;
  }
  .tree{
    position:absolute;
    bottom:20%;
    width:0; height:0;
  }
  .tree .tier{
    width:0;height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-bottom:22px solid #1e5b39;
    margin-bottom:-7px;
  }
  .tree .tier.t2{border-left:20px solid transparent; border-right:20px solid transparent; border-bottom:26px solid #226b3f;}
  .tree .tier.t3{border-left:24px solid transparent; border-right:24px solid transparent; border-bottom:30px solid #277747;}
  .tree.big{ left:50%; transform:translateX(-50%); bottom:22%; }
  .tree.small1{ left:22%; transform:scale(.6); bottom:20%; }
  .tree.small2{ right:18%; left:auto; transform:scale(.5); bottom:20%; }
  .star-top{
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    color:var(--gold); font-size:16px;
    animation: twinkle 1.2s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .snowflake{
    position:absolute;
    top:-6%;
    border-radius:50%;
    background:#fff;
    opacity:0;
    box-shadow: 0 0 4px 1px rgba(255,255,255,.8);
  }
  .globe-glass.snowing .snowflake{
    animation-name: snowFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes snowFall{
    0%{ opacity:0; transform:translateY(0) translateX(0); }
    8%{ opacity:1; }
    100%{ opacity:1; transform:translateY(115%) translateX(6px); }
  }

  .sanity-label{
    position:absolute;
    top:6px; left:50%;
    transform:translateX(-50%);
    font-size:13px;
    font-weight:700;
    color:#7ee787;
    background:rgba(0,0,0,.55);
    padding:4px 10px;
    border-radius:8px;
    display:none;
    z-index:5;
  }
  .globe-glass.snowing .sanity-label{ display:block; }

  .base{
    position:absolute;
    left:50%; bottom:-6%;
    transform:translateX(-50%);
    width:60%;
    height:16%;
    background: linear-gradient(180deg, #12306e, #081536);
    border-radius:14px;
    border:2px solid rgba(245,198,35,.5);
  }

  .hint{
    margin-top:26px;
    font-size:12px;
    color:#8fa0c9;
    min-height:16px;
  }
  #enableBtn{
    margin-top:18px;
    padding:11px 20px;
    border-radius:999px;
    border:none;
    background: linear-gradient(135deg, var(--gold), #c99b1e);
    color:#1a1400;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:none;
  }

  #debugPanel{
    position:fixed;
    left:8px; bottom:8px; right:8px;
    background:rgba(0,0,0,.6);
    border:1px solid #223258;
    border-radius:10px;
    padding:8px 10px;
    font-size:10px;
    line-height:1.5;
    color:#9fd6a8;
    font-family:monospace;
    z-index:40;
    max-height:32vh;
    overflow-y:auto;
    text-align:left;
  }
  #debugPanel b{ color:var(--gold); }

  #testBtn{
    margin-top:10px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    font-size:12px;
    cursor:pointer;
  }

  /* Force animations even if the phone has "Reduce Motion" turned on,
     since some browsers silently disable ALL CSS animations in that mode */
  @media (prefers-reduced-motion: reduce){
    .globe-wrap.shaking,
    .globe-glass.snowing .snowflake,
    .star-top{
      animation-duration: revert !important;
      animation-name: revert !important;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="headline" id="headline">Frohe Weihnachten</div>
  <div class="subline" id="subline">Tippen Sie auf die Kugel oder schütteln Sie Ihr Handy</div>

  <div class="globe-wrap" id="globeWrap">
    <div class="globe-glass" id="globeGlass">
      <div class="sanity-label">❄️ Snowing...</div>
      <div class="scene">
        <div class="tree big"><span class="star-top">⭐</span><div class="tier"></div><div class="tier t2"></div><div class="tier t3"></div></div>
        <div class="tree small1"><div class="tier"></div><div class="tier t2"></div></div>
        <div class="tree small2"><div class="tier"></div><div class="tier t2"></div></div>
        <div class="ground"></div>
      </div>
    </div>
    <div class="base"></div>
  </div>

  <button id="enableBtn">Bewegungssensor aktivieren</button>
  <button id="testBtn">🧪 Test Snow (manuell auslösen)</button>
  <div class="hint" id="hint"></div>
</div>

<div id="debugPanel">
  <div><b>Debug</b></div>
  <div id="dbgSupport">devicemotion supported: checking...</div>
  <div id="dbgPermission">permission: n/a</div>
  <div id="dbgSecure">secure context (https): checking...</div>
  <div id="dbgEvents">events received: 0</div>
  <div id="dbgSpeed">last speed: -</div>
  <div id="dbgTrigger">shake triggers: 0</div>
  <div id="dbgSnowing">snowing class active: false</div>
  <div id="dbgReduced">prefers-reduced-motion: checking...</div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const globeWrap = document.getElementById('globeWrap');
  const globeGlass = document.getElementById('globeGlass');
  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');
  const hint = document.getElementById('hint');
  const enableBtn = document.getElementById('enableBtn');

  const dbgSupport = document.getElementById('dbgSupport');
  const dbgPermission = document.getElementById('dbgPermission');
  const dbgSecure = document.getElementById('dbgSecure');
  const dbgEvents = document.getElementById('dbgEvents');
  const dbgSpeed = document.getElementById('dbgSpeed');
  const dbgTrigger = document.getElementById('dbgTrigger');
  const dbgSnowing = document.getElementById('dbgSnowing');
  const dbgReduced = document.getElementById('dbgReduced');
  const testBtn = document.getElementById('testBtn');
  let eventCount = 0;
  let triggerCount = 0;

  dbgSupport.textContent = 'devicemotion supported: ' + (typeof DeviceMotionEvent !== 'undefined');
  dbgSecure.textContent = 'secure context (https): ' + window.isSecureContext;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  dbgReduced.textContent = 'prefers-reduced-motion: ' + reducedMotion + (reducedMotion ? '  ⚠️ ISKO PHONE SETTINGS SE OFF KAREIN' : '');

  for(let i=0;i<26;i++){
    const s = document.createElement('div');
    s.className='bgstar';
    const size = Math.random()*2+1;
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*70+'vh';
    s.style.animationDelay = Math.random()*2.5+'s';
    stage.insertBefore(s, stage.firstChild);
  }

  const FLAKE_COUNT = 35;
  for(let i=0;i<FLAKE_COUNT;i++){
    const f = document.createElement('div');
    f.className='snowflake';
    const size = Math.random()*4+6;
    f.style.width=size+'px'; f.style.height=size+'px';
    f.style.left = (5+Math.random()*90)+'%';
    f.style.animationDuration = (Math.random()*2+2.5)+'s';
    f.style.animationDelay = (Math.random()*3)+'s';
    globeGlass.appendChild(f);
  }

  let cooldownUntil = 0;

  function shakeSnowGlobe(){
    const now = Date.now();
    if(now < cooldownUntil) return;
    cooldownUntil = now + 3500;
    triggerCount++;
    dbgTrigger.textContent = 'shake triggers: ' + triggerCount;

    globeWrap.classList.remove('shaking');
    void globeWrap.offsetWidth;
    globeWrap.classList.add('shaking');

    globeGlass.classList.add('snowing');
    dbgSnowing.textContent = 'snowing class active: true';
    headline.style.opacity = '0.4';
    subline.style.opacity = '0.4';
    if(navigator.vibrate) navigator.vibrate([50,30,50]);

    setTimeout(()=>{ headline.style.opacity='1'; subline.style.opacity='1'; }, 400);
    setTimeout(()=>{
      globeGlass.classList.remove('snowing');
      dbgSnowing.textContent = 'snowing class active: false';
    }, 6000);
  }

  globeWrap.addEventListener('click', shakeSnowGlobe);
  testBtn.addEventListener('click', shakeSnowGlobe);

  let lastX=null,lastY=null,lastZ=null,lastTime=0;
  const SHAKE_THRESHOLD = 16;

  function handleMotion(event){
    eventCount++;
    dbgEvents.textContent = 'events received: ' + eventCount;
    const acc = event.accelerationIncludingGravity || event.acceleration;
    if(!acc || acc.x==null) return;
    const {x,y,z} = acc;
    const currentTime = Date.now();
    if(lastTime && (currentTime-lastTime) > 100){
      const diffTime = currentTime-lastTime;
      const speed = Math.abs(x+y+z-lastX-lastY-lastZ)/diffTime*10000;
      dbgSpeed.textContent = 'last speed: ' + speed.toFixed(1) + ' (threshold '+SHAKE_THRESHOLD+')';
      if(speed > SHAKE_THRESHOLD) shakeSnowGlobe();
      lastX=x;lastY=y;lastZ=z;lastTime=currentTime;
    } else if(!lastTime){
      lastX=x;lastY=y;lastZ=z;lastTime=currentTime;
    }
  }

  function startListening(){
    window.addEventListener('devicemotion', handleMotion);
    hint.textContent = 'Bewegungssensor aktiv — schütteln Sie Ihr Handy.';
    setTimeout(()=>{
      if(eventCount===0){
        hint.textContent = '⚠️ Kein Sensor-Signal erkannt — bitte über HTTPS öffnen, nicht in der Vorschau.';
      }
    },1500);
  }

  if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    dbgPermission.textContent = 'permission: requestPermission() available (iOS 13+)';
    enableBtn.style.display='inline-block';
    hint.textContent = 'iOS: Bitte Button drücken, um Bewegungssensor zu erlauben.';
    enableBtn.addEventListener('click', async ()=>{
      try{
        const res = await DeviceMotionEvent.requestPermission();
        dbgPermission.textContent = 'permission: ' + res;
        if(res === 'granted'){
          enableBtn.style.display='none';
          startListening();
        } else {
          hint.textContent = 'Zugriff verweigert. In den Safari-Einstellungen erlauben.';
        }
      }catch(e){
        hint.textContent = 'Fehler: ' + e.message;
      }
    });
  } else if(window.DeviceMotionEvent){
    dbgPermission.textContent = 'permission: not required';
    startListening();
  } else {
    dbgPermission.textContent = 'permission: unsupported';
    hint.textContent = 'Bewegungssensor wird hier nicht unterstützt — einfach antippen.';
  }
})();
</script>

</body>
</html>
